<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bae6fd;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#skyGradient)"/>
  
  <!-- Building -->
  <rect x="200" y="150" width="400" height="450" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
  
  <!-- Windows -->
  <g fill="#0ea5e9" opacity="0.6">
    <rect x="230" y="200" width="60" height="60" rx="4"/>
    <rect x="310" y="200" width="60" height="60" rx="4"/>
    <rect x="390" y="200" width="60" height="60" rx="4"/>
    <rect x="470" y="200" width="60" height="60" rx="4"/>
    
    <rect x="230" y="290" width="60" height="60" rx="4"/>
    <rect x="310" y="290" width="60" height="60" rx="4"/>
    <rect x="390" y="290" width="60" height="60" rx="4"/>
    <rect x="470" y="290" width="60" height="60" rx="4"/>
    
    <rect x="230" y="380" width="60" height="60" rx="4"/>
    <rect x="310" y="380" width="60" height="60" rx="4"/>
    <rect x="390" y="380" width="60" height="60" rx="4"/>
    <rect x="470" y="380" width="60" height="60" rx="4"/>
  </g>
  
  <!-- Entrance -->
  <rect x="350" y="480" width="100" height="120" fill="#334155" />
  
  <!-- Sign -->
  <rect x="250" y="100" width="300" height="60" fill="#0284c7" rx="8"/>
  <text x="400" y="140" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">CITY GENERAL</text>
  
  <!-- Cross -->
  <rect x="385" y="40" width="30" height="30" fill="#ef4444" rx="4"/>
  <rect x="395" y="30" width="10" height="50" fill="white"/>
  <rect x="375" y="50" width="50" height="10" fill="white"/>
</svg>
